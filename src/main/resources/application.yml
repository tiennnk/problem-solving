spring:
  application:
    name: problem-solving-orchestrator
  config:
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

llm:
  base-url: ${LLM_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
  model: ${LLM_MODEL:gemini-3.8-flash}
  api-key: ${LLM_API_KEY:}
  timeout: ${LLM_TIMEOUT:60s}
  max-attempts: ${LLM_MAX_ATTEMPTS:3}
  retry-backoff: ${LLM_RETRY_BACKOFF:2s}
  max-retry-delay: ${LLM_MAX_RETRY_DELAY:65s}

sandbox:
  docker-command: ${SANDBOX_DOCKER_COMMAND:docker}
  java-image: eclipse-temurin:21-jdk-alpine
  php-image: php:8.4-cli-alpine
  memory-mb: 512
  cpus: 1.0
  pids-limit: 128
  compile-timeout: 30s
  run-timeout: 5s
  max-output-bytes: 1000000
